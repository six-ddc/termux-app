name: Ghostty checks

on:
  push:
    branches:
      - master
      - termuxplus-foundation
  pull_request:
    branches:
      - master
      - termuxplus-foundation

jobs:
  # Static guard: the terminal core must stay fully delegated to libghostty-vt
  # with no Java VT fallback. Pure ripgrep over the source, no device needed.
  no-fallback-static:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run no-fallback static checks
        run: ./scripts/check-ghostty-no-fallback.sh

  # Instrumented VT regression tests on an x86_64 emulator. libghostty-vt.so is
  # gitignored, so it is built from source for x86_64 before the tests run.
  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install matching NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Build libghostty-vt for x86_64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./scripts/build-ghostty-vt-android.sh x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TERMUX_BOOTSTRAP_ARCHS: x86_64
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: ./gradlew :terminal-emulator:connectedDebugAndroidTest
