plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

def termuxBootstrapArchToAbi = [
    "aarch64": "arm64-v8a",
    "arm": "armeabi-v7a",
    "i686": "x86",
    "x86_64": "x86_64"
]
def termuxBootstrapArchs = (System.getenv("TERMUX_BOOTSTRAP_ARCHS") ?: "aarch64,arm,i686,x86_64")
    .split(",")
    .collect { it.trim() }
    .findAll { it }
def termuxBootstrapAbis = termuxBootstrapArchs.collect { arch ->
    if (!termuxBootstrapArchToAbi.containsKey(arch)) {
        throw new GradleException("Unsupported TERMUX_BOOTSTRAP_ARCHS entry \"" + arch + "\"")
    }
    termuxBootstrapArchToAbi[arch]
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "com.termux"

        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 118
        versionName "0.118.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include(*termuxBootstrapAbis)
                universalApk termuxBootstrapAbis.size() > 1
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        noCompress += "apk"
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets/autotermux"
            assets.srcDirs += "$buildDir/generated/assets/termuxplus-cli"
            assets.srcDirs += "$buildDir/generated/assets/termuxplus-home"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def filesHaveSameBytes(File first, File second) {
    if (!first.exists() || first.length() != second.length()) return false

    def firstInput = new BufferedInputStream(new FileInputStream(first))
    def secondInput = new BufferedInputStream(new FileInputStream(second))
    try {
        def firstBuffer = new byte[8192]
        def secondBuffer = new byte[8192]
        while (true) {
            def firstBytes = firstInput.read(firstBuffer)
            def secondBytes = secondInput.read(secondBuffer)
            if (firstBytes != secondBytes) return false
            if (firstBytes < 0) return true
            for (int i = 0; i < firstBytes; i++) {
                if (firstBuffer[i] != secondBuffer[i]) return false
            }
        }
    } finally {
        firstInput.close()
        secondInput.close()
    }
}

def bootstrapAbiForArch(String arch) {
    switch (arch) {
        case "aarch64": return "arm64-v8a"
        case "arm": return "armeabi-v7a"
        case "i686": return "x86"
        case "x86_64": return "x86_64"
        default: return null
    }
}

def invalidateBootstrapNativeOutputs(String arch) {
    def abi = bootstrapAbiForArch(arch)
    if (!abi) return

    def patterns = [
        "intermediates/cxx/**/obj/local/${abi}/objs*/termux-bootstrap/termux-bootstrap-zip.o",
        "intermediates/cxx/**/obj/local/${abi}/objs*/termux-bootstrap/termux-bootstrap-zip.o.d",
        "intermediates/cxx/**/obj/local/${abi}/libtermux-bootstrap.so",
        "intermediates/merged_native_libs/**/out/lib/${abi}/libtermux-bootstrap.so",
        "intermediates/stripped_native_libs/**/out/lib/${abi}/libtermux-bootstrap.so"
    ]

    patterns.each { pattern ->
        fileTree(buildDir).matching { include pattern }.each { file ->
            if (file.delete()) {
                logger.info("Deleted stale bootstrap native output " + file)
            }
        }
    }
}

def readZipEntryText(java.util.zip.ZipFile zipFile, String entryName) {
    def entry = zipFile.getEntry(entryName)
    if (entry == null || entry.isDirectory()) return ""

    def input = zipFile.getInputStream(entry)
    try {
        return input.getText("UTF-8")
    } finally {
        input.close()
    }
}

def validateCustomBootstrap(File source, String arch) {
    def zipFile = new java.util.zip.ZipFile(source)
    try {
        def entries = zipFile.entries().collect { it.name }
        def content = new StringBuilder()
        ["SYMLINKS.txt", "bin/pkg", "etc/apt/sources.list", "etc/zshrc"].each { entryName ->
            content.append(readZipEntryText(zipFile, entryName)).append("\n")
        }
        entries.findAll { it ==~ /var\/lib\/dpkg\/info\/.*\.list/ }.each { entryName ->
            content.append(readZipEntryText(zipFile, entryName)).append("\n")
        }

        def contentText = content.toString()
        if (contentText =~ /\/data\/data\/com\.yourcompany\.termuxplus/) {
            throw new GradleException("Custom bootstrap " + source + " for " + arch + " still contains old custom package prefix /data/data/com.yourcompany.termuxplus.")
        }
        if (!(contentText =~ /\/data\/data\/com\.termux\/files\/usr/).find()) {
            throw new GradleException("Custom bootstrap " + source + " for " + arch + " must target /data/data/com.termux/files/usr.")
        }
        if (!(contentText =~ /packages(-cf)?\.termux\.dev|packages\.termux\.org|termux-main/).find()) {
            throw new GradleException("Custom bootstrap " + source + " for " + arch + " must contain an official Termux apt source.")
        }
    } finally {
        zipFile.close()
    }
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def customBootstrapDir = System.getenv("TERMUX_BOOTSTRAP_DIR") ?: ""
    if (customBootstrapDir) {
        def source = new File(customBootstrapDir, "bootstrap-" + arch + ".zip")
        if (!source.exists()) {
            throw new GradleException("TERMUX_BOOTSTRAP_DIR does not contain " + source.getName() + ". Build matching bootstraps for /data/data/com.termux/files/usr first.")
        }
        validateCustomBootstrap(source, arch)

        def target = new File(projectDir, "src/main/cpp/bootstrap-" + arch + ".zip")
        target.parentFile.mkdirs()
        if (!filesHaveSameBytes(target, source)) {
            target.bytes = source.bytes
            invalidateBootstrapNativeOutputs(arch)
        }
        logger.quiet("Using custom Termux bootstrap " + source + " for " + arch)
        return
    }

    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            if (file.delete()) {
                invalidateBootstrapNativeOutputs(arch)
            }
        }
    }

    def remoteUrl = "https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
    invalidateBootstrapNativeOutputs(arch)
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

task downloadBootstraps() {
    doLast {
        def packageVariant = project.ext.packageVariant
        if (packageVariant == "apt-android-7") {
            def version = "2026.02.12-r1" + "%2B" + "apt.android-7"
            def checksums = [
                "aarch64": "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3",
                "arm": "a38f4d3b2f735f83be2bf54eff463e86dc32a3e2f9f861c1557c4378d249c018",
                "i686": "f5bc0b025b9f3b420b5fcaeefc064f888f5f22a0d6fd7090f4aac0c33eb3555b",
                "x86_64": "b7fd0f2e3a4de534be3144f9f91acc768630fc463eaf134ab2e64c545e834f7a"
            ]
            termuxBootstrapArchs.each { arch -> downloadBootstrap(arch, checksums[arch], version) }
        } else if (packageVariant == "apt-android-5") {
            def version = "2022.04.28-r6" + "+" + packageVariant
            def checksums = [
                "aarch64": "913609d439415c828c5640be1b0561467e539cb1c7080662decaaca2fb4820e7",
                "arm": "26bfb45304c946170db69108e5eb6e3641aad751406ce106c80df80cad2eccf8",
                "i686": "46dcfeb5eef67ba765498db9fe4c50dc4690805139aa0dd141a9d8ee0693cd27",
                "x86_64": "615b590679ee6cd885b7fd2ff9473c845e920f9b422f790bb158c63fe42b8481"
            ]
            termuxBootstrapArchs.each { arch -> downloadBootstrap(arch, checksums[arch], version) }
        } else {
            throw new GradleException("Unsupported TERMUX_PACKAGE_VARIANT \"" + packageVariant + "\"")
        }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        def autoTermuxVariantName = variant.name.capitalize()
        def autoTermuxBuildTypeName = variant.buildType.name
        def autoTermuxGeneratedAssetsRoot = file("$buildDir/generated/assets/autotermux")
        def autoTermuxAssetDir = file("$buildDir/generated/assets/autotermux/autotermux")
        def autoTermuxApkFileProvider = project(":automation-portal").layout.buildDirectory.file(
            "outputs/apk/${autoTermuxBuildTypeName}/autotermux-${autoTermuxBuildTypeName}.apk"
        )
        def termuxPlusCliGeneratedAssetsRoot = file("$buildDir/generated/assets/termuxplus-cli")
        def termuxPlusCliAssetDir = file("$buildDir/generated/assets/termuxplus-cli/termuxplus/bin")
        def termuxPlusCliSource = rootProject.file("bootstrap/bin/tp-android")
        def termuxPlusHomeGeneratedAssetsRoot = file("$buildDir/generated/assets/termuxplus-home")
        def termuxPlusHomeAssetDir = file("$buildDir/generated/assets/termuxplus-home/termuxplus/home")
        def termuxPlusSkillsAssetDir = file("$buildDir/generated/assets/termuxplus-home/termuxplus/codex-skills")
        def termuxPlusHomeAgentsSource = rootProject.file("bootstrap/home/AGENTS.md")
        def termuxPlusHomeSkillsSource = rootProject.file("bootstrap/home/.codex/skills")
        def copyAutoTermuxAssetTask = tasks.register("copyAutoTermux${autoTermuxVariantName}Asset") {
            dependsOn(":automation-portal:assemble${autoTermuxVariantName}")
            inputs.file(autoTermuxApkFileProvider)
            outputs.dir(autoTermuxGeneratedAssetsRoot)
            doLast {
                def sourceApk = autoTermuxApkFileProvider.get().asFile
                if (!sourceApk.isFile()) {
                    throw new GradleException("AutoTermux APK was not built at ${sourceApk}")
                }

                project.delete(autoTermuxGeneratedAssetsRoot)
                autoTermuxAssetDir.mkdirs()
                def targetApk = new File(autoTermuxAssetDir, "AutoTermux.apk")
                targetApk.bytes = sourceApk.bytes

                def manifestFile = new File(autoTermuxAssetDir, "manifest.json")
                manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    packageName: "com.termux.autotermux",
                    versionName: "0.1.0",
                    sourceApk: sourceApk.name
                ])) + "\n"
            }
        }
        def copyTermuxPlusCliAssetTask = tasks.register("copyTermuxPlusCli${autoTermuxVariantName}Asset") {
            inputs.file(termuxPlusCliSource)
            outputs.dir(termuxPlusCliGeneratedAssetsRoot)
            doLast {
                if (!termuxPlusCliSource.isFile()) {
                    throw new GradleException("TermuxPlus CLI source was not found at ${termuxPlusCliSource}")
                }

                project.delete(termuxPlusCliGeneratedAssetsRoot)
                termuxPlusCliAssetDir.mkdirs()
                def targetCli = new File(termuxPlusCliAssetDir, "tp-android")
                targetCli.bytes = termuxPlusCliSource.bytes
            }
        }
        def copyTermuxPlusHomeAssetTask = tasks.register("copyTermuxPlusHome${autoTermuxVariantName}Asset") {
            inputs.file(termuxPlusHomeAgentsSource)
            inputs.dir(termuxPlusHomeSkillsSource)
            outputs.dir(termuxPlusHomeGeneratedAssetsRoot)
            doLast {
                if (!termuxPlusHomeAgentsSource.isFile()) {
                    throw new GradleException("TermuxPlus home AGENTS.md source was not found at ${termuxPlusHomeAgentsSource}")
                }
                if (!termuxPlusHomeSkillsSource.isDirectory()) {
                    throw new GradleException("TermuxPlus home skills source was not found at ${termuxPlusHomeSkillsSource}")
                }

                project.delete(termuxPlusHomeGeneratedAssetsRoot)
                termuxPlusHomeAssetDir.mkdirs()
                def targetAgents = new File(termuxPlusHomeAssetDir, "AGENTS.md")
                targetAgents.bytes = termuxPlusHomeAgentsSource.bytes
                project.copy {
                    from termuxPlusHomeSkillsSource
                    into termuxPlusSkillsAssetDir
                    includeEmptyDirs = false
                }
            }
        }

        variant.mergeAssetsProvider.configure {
            dependsOn(copyAutoTermuxAssetTask)
            dependsOn(copyTermuxPlusCliAssetTask)
            dependsOn(copyTermuxPlusHomeAssetTask)
        }
        variant.preBuildProvider.configure { dependsOn(downloadBootstraps) }
        variant.javaCompileProvider.get().dependsOn(downloadBootstraps)
    }
}
